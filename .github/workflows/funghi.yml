      - uses: actions/setup-python@v5
        if: steps.chk.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Installa le librerie
        if: steps.chk.outputs.skip != 'true'
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.14.*" torchvision
          pip install "timm==1.0.30" "onnx==1.23.*" "onnxruntime==1.29.*" pillow numpy requests

      - name: Scarica e converti il modello (Danish Fungi 2020) e il modello del contorno
        if: steps.chk.outputs.skip != 'true'
        run: |
          python tools/make_icons.py site
          python tools/build_model.py --site site
          mkdir -p site/seg
          curl -sSfL --retry 3 -o site/seg/u2netp.onnx https://github.com/danielgatis/rembg/releases/download/v0.0.0/u2netp.onnx
          echo "309c8469258dda742793dce0ebea8e6dd393174f89934733ecc8b14c76f4ddd8  site/seg/u2netp.onnx" | sha256sum -c -
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          curl -sfL "https://$OWNER.github.io/${{ github.event.repository.name }}/model/config.json" -o published_config.json || echo "Nessuna versione pubblicata da confrontare."

      - name: Specializza sulle specie piemontesi e sugli alberi (foto iNaturalist)
        id: ft
        if: steps.chk.outputs.skip != 'true'
        run: |
          set +e
          rm -f inat_data/COMPLETO
          python tools/finetune.py --site site --data inat_data --seg site/seg/u2netp.onnx --published published_config.json
          code=$?
          if [ $code -eq 0 ]; then
            python tools/trees.py --site site --data inat_data --budget-min 30 || echo "::warning::Riconoscimento dell'albero non disponibile in questa versione."
            touch inat_data/COMPLETO
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ $code -eq 3 ]; then
            echo "::notice::Raccolta e studio delle foto non ancora finiti: il lavoro è salvato e riprende da solo la notte prossima. Online resta la versione precedente."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ $code -eq 4 ]; then
            echo "::warning::La nuova versione riconoscerebbe peggio le specie pericolose: NON pubblicata. Online resta la versione precedente."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Errore nella specializzazione (codice $code). Online resta la versione precedente."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
          python -c "import json;c=json.load(open('site/model/config.json'));print(json.dumps({k:c.get(k) for k in ('head_b','trees')},indent=1,ensure_ascii=False))" || true

      - name: Salva le foto e lo studio fatto (anche se incompleto)
        if: always() && steps.chk.outputs.skip != 'true'
        uses: actions/cache/save@v4
        with:
          path: inat_data
          key: inat-v2-${{ github.run_id }}

      - name: Aggiungi il motore ONNX Runtime Web
        if: steps.ft.outputs.publish == 'true'
        run: |
          npm pack onnxruntime-web@1.30.0 --silent
          tar xzf onnxruntime-web-1.30.0.tgz
          mkdir -p site/ort
          cp package/dist/ort.wasm.min.js package/dist/ort-wasm-simd-threaded.wasm package/dist/ort-wasm-simd-threaded.mjs site/ort/
          VERSION=$(python -c "import json;print(json.load(open('site/model/config.json'))['version'])")
          sed -i "s/__VERSION__/$VERSION/" site/sw.js
          touch site/.nojekyll
          du -sh site site/model/*

      - uses: actions/configure-pages@v5
        if: steps.ft.outputs.publish == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.ft.outputs.publish == 'true'
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
