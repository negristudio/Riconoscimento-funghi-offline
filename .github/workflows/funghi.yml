      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa le librerie
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.14.*"
          pip install "timm==1.0.30" "onnx==1.23.*" "onnxruntime==1.29.*" pillow numpy requests

      - name: Scarica e converti il modello (Danish Fungi 2020)
        run: |
          python tools/make_icons.py site
          python tools/build_model.py --site site

      - name: Ripristina le foto iNaturalist già scaricate
        uses: actions/cache@v4
        with:
          path: inat_data
          key: inat-v1-${{ hashFiles('site/data/specie_piemonte.json') }}-${{ github.run_id }}
          restore-keys: |
            inat-v1-${{ hashFiles('site/data/specie_piemonte.json') }}-
            inat-v1-

      - name: Specializza sulle specie piemontesi (foto iNaturalist)
        run: |
          python tools/finetune.py --site site --data inat_data || echo "::warning::Specializzazione italiana non riuscita o non migliorativa: l'app usa il solo modello DF20"
          python -c "import json;h=json.load(open('site/model/config.json')).get('head_b');print(json.dumps(h,indent=1,ensure_ascii=False))"

      - name: Aggiungi il motore ONNX Runtime Web
        run: |
          npm pack onnxruntime-web@1.30.0 --silent
          tar xzf onnxruntime-web-1.30.0.tgz
          mkdir -p site/ort
          cp package/dist/ort.wasm.min.js package/dist/ort-wasm-simd-threaded.wasm package/dist/ort-wasm-simd-threaded.mjs site/ort/
          VERSION=$(python -c "import json;print(json.load(open('site/model/config.json'))['version'])")
          sed -i "s/__VERSION__/$VERSION/" site/sw.js
          touch site/.nojekyll
          du -sh site site/model/*

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
