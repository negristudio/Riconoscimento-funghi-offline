# App Funghi Piemonte: costruisce il modello e pubblica l'app su GitHub Pages.
# Basta salvare questo file: la costruzione parte da sola.
# La prima volta raccoglie decine di migliaia di foto italiane da iNaturalist: se non
# finisce entro il tempo massimo di GitHub, salva il lavoro e riprende da sola la notte
# successiva. Finché non ha finito, online resta la versione precedente dell'app.
name: Costruisci app Funghi

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: "17 1 * * *"     # ogni notte: riprende il lavoro solo se era rimasto a metà

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      publish: ${{ steps.ft.outputs.publish }}
    steps:
      - name: Ripristina le foto iNaturalist già scaricate
        uses: actions/cache/restore@v4
        with:
          path: inat_data
          key: inat-v2-${{ github.run_id }}
          restore-keys: |
            inat-v2-
            inat-v1-

      - name: Serve lavorare?
        id: chk
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f inat_data/COMPLETO ]; then
            echo "Tutto già completato e pubblicato: niente da fare stanotte."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Estrai i file dell'app
        if: steps.chk.outputs.skip != 'true'
        run: |
          base64 -d > app.tar.gz <<'FINE'
